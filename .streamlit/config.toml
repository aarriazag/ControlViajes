[client]
# Con esto, un error ya no muestra el traceback completo (rutas de archivo,
# tipo de excepción, detalles de la consulta) a quien esté usando la app —
# solo un mensaje genérico. El detalle completo se sigue escribiendo en la
# consola del servidor (Render → Logs), donde solo tú lo puedes ver.
showErrorDetails = false

# Oculta del menú "..." las opciones de desarrollador (limpiar caché, ver
# el código fuente, etc.) para cualquiera que no sea tú corriendo en local.
toolbarMode = "viewer"
